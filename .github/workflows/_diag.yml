name: Diag

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/_diag.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe CASE30 fetch strategies
        run: |
          python3 -c "
          import yfinance as yf
          for sym in ['^CASE30', '^EGX30.CA', '^EGX30CAPPED.CA']:
              for period in ['2y', '5y', 'max']:
                  try:
                      df = yf.Ticker(sym).history(period=period, interval='1d')
                      print(sym, period, len(df), df.index[0] if len(df) else None, df.index[-1] if len(df) else None)
                  except Exception as e:
                      print(sym, period, 'ERROR', e)
              try:
                  t = yf.Ticker(sym)
                  print(sym, 'fast_info firstTradeDate:', getattr(t, 'fast_info', {}).get('firstTradeDate', 'n/a') if hasattr(t, 'fast_info') else 'n/a')
              except Exception as e:
                  print(sym, 'fast_info ERROR', e)
          "
