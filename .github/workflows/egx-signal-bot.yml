name: EGX Signal Bot

on:
  # Bootstrap trigger: GitHub only lists a workflow (and allows manual
  # dispatch) once it has actually run at least once. Remove this block
  # after the first run has registered the workflow.
  push:
    branches: [main]
    paths: [".github/workflows/egx-signal-bot.yml"]
  schedule:
    # ~15:30 Cairo time (EET, UTC+2), Sun-Thu, after the EGX close.
    # Adjust if Egypt is observing a DST offset (UTC+3) at the time.
    - cron: "30 13 * * 0,1,2,3,4"
  workflow_dispatch: {}

jobs:
  run-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py
