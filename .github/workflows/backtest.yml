name: Backtest

on:
  workflow_dispatch:
    inputs:
      period:
        description: "yfinance history period (e.g. 1y, 2y, 3y, 5y)"
        required: false
        default: "3y"
      split:
        description: "Optional in-sample fraction (e.g. 0.6) to run a walk-forward split instead of a single full-period backtest"
        required: false
        default: ""
      regime_filter:
        description: "Set to 'true' to only take BUY signals while EGX30 is above its own SMA"
        required: false
        default: "false"
      trailing_stop:
        description: "Set to 'true' to exit at an ATR trailing stop that ratchets up behind the highest high"
        required: false
        default: "false"
      trail_sweep:
        description: "Space-separated ATR trail widths to compare against the baseline, e.g. '3 5 6 8' (overrides other modes)"
        required: false
        default: ""
      vs_hold:
        description: "Set to 'true' to compare buy-and-hold vs strategy vs hold-with-signal-exits (overrides other modes)"
        required: false
        default: "false"

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          # Without this, Python block-buffers stdout to the runner's pipe and
          # a long sweep shows no output at all until it finishes - which makes
          # a slow run indistinguishable from a hung one.
          PYTHONUNBUFFERED: "1"
          SPLIT: ${{ github.event.inputs.split }}
          REGIME_FILTER: ${{ github.event.inputs.regime_filter }}
          TRAILING_STOP: ${{ github.event.inputs.trailing_stop }}
          TRAIL_SWEEP: ${{ github.event.inputs.trail_sweep }}
          VS_HOLD: ${{ github.event.inputs.vs_hold }}
        run: |
          ARGS="--period ${{ github.event.inputs.period || '3y' }}"
          if [ "$VS_HOLD" = "true" ]; then
            python backtest.py $ARGS --vs-hold
            exit 0
          fi
          if [ -n "$TRAIL_SWEEP" ]; then
            python backtest.py $ARGS --trail-sweep $TRAIL_SWEEP
            exit 0
          fi
          if [ -n "$SPLIT" ]; then
            ARGS="$ARGS --split $SPLIT"
          fi
          if [ "$REGIME_FILTER" = "true" ]; then
            ARGS="$ARGS --regime-filter"
          fi
          if [ "$TRAILING_STOP" = "true" ]; then
            ARGS="$ARGS --trailing-stop"
          fi
          python backtest.py $ARGS
