name: Backtest

on:
  workflow_dispatch:
    inputs:
      period:
        description: "yfinance history period (e.g. 1y, 2y, 3y, 5y)"
        required: false
        default: "3y"
      split:
        description: "Optional in-sample fraction (e.g. 0.6) to run a walk-forward split instead of a single full-period backtest"
        required: false
        default: ""

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          SPLIT: ${{ github.event.inputs.split }}
        run: |
          if [ -n "$SPLIT" ]; then
            python backtest.py --period "${{ github.event.inputs.period || '3y' }}" --split "$SPLIT"
          else
            python backtest.py --period "${{ github.event.inputs.period || '3y' }}"
          fi
