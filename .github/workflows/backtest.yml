name: Backtest

on:
  push:
    branches: [main]
    paths: [".github/workflows/backtest.yml"]
  workflow_dispatch:
    inputs:
      period:
        description: "yfinance history period (e.g. 1y, 2y, 3y, 5y)"
        required: false
        default: "3y"

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        run: python backtest.py --period "${{ github.event.inputs.period }}"
