name: Backtest

on:
  workflow_dispatch:
    inputs:
      period:
        description: "yfinance history period (e.g. 1y, 2y, 3y, 5y)"
        required: false
        default: "3y"
      split:
        description: "Optional in-sample fraction (e.g. 0.6) to run a walk-forward split instead of a single full-period backtest"
        required: false
        default: ""
      regime_filter:
        description: "Set to 'true' to only take BUY signals while EGX30 is above its own SMA"
        required: false
        default: "false"

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          SPLIT: ${{ github.event.inputs.split }}
          REGIME_FILTER: ${{ github.event.inputs.regime_filter }}
        run: |
          ARGS="--period ${{ github.event.inputs.period || '3y' }}"
          if [ -n "$SPLIT" ]; then
            ARGS="$ARGS --split $SPLIT"
          fi
          if [ "$REGIME_FILTER" = "true" ]; then
            ARGS="$ARGS --regime-filter"
          fi
          python backtest.py $ARGS
